name: docs

on:
  push

jobs:
  build_docs:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
    - name: Set up  python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: install dependencies
      run: |
        pip install -r ./docs/requirements.txt

    - name: create slides 
      run: |
        jupyter nbconvert --to slides --embed-images --template custom_reveal --TemplateExporter.extra_template_basedirs=./docs/ --output-dir docs/source/_static "notebooks/*.ipynb"

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Prepare output dir
      run: |
        mkdir -p docs/source/_static

    - name: Convert upstream lecture 1 to PDF (print view)
      uses: fifsky/html-to-pdf-action@master
      with:
        htmlFile: https://mmoelle1.github.io/OospCpp/_static/lecture1.slides.html?print-pdf
        outputFile: ./docs/source/_static/lecture1.slides.pdf
        pdfOptions: '{"format": "A4", "landscape": true, "printBackground": true, "preferCSSPageSize": true, "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

    - name: Convert upstream lecture 2 to PDF (print view)
      uses: fifsky/html-to-pdf-action@master
      with:
        htmlFile: https://mmoelle1.github.io/OospCpp/_static/lecture2.slides.html?print-pdf
        outputFile: ./docs/source/_static/lecture2.slides.pdf
        pdfOptions: '{"format": "A4", "landscape": true, "printBackground": true, "preferCSSPageSize": true, "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

    - name: Convert upstream lecture 3 to PDF (print view)
      uses: fifsky/html-to-pdf-action@master
      with:
        htmlFile: https://mmoelle1.github.io/OospCpp/_static/lecture3.slides.html?print-pdf
        outputFile: ./docs/source/_static/lecture3.slides.pdf
        pdfOptions: '{"format": "A4", "landscape": true, "printBackground": true, "preferCSSPageSize": true, "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

    - name: Convert upstream lecture 4 to PDF (print view)
      uses: fifsky/html-to-pdf-action@master
      with:
        htmlFile: https://mmoelle1.github.io/OospCpp/_static/lecture4.slides.html?print-pdf
        outputFile: ./docs/source/_static/lecture4.slides.pdf
        pdfOptions: '{"format": "A4", "landscape": true, "printBackground": true, "preferCSSPageSize": true, "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

    - name: Convert upstream lecture 5 to PDF (print view)
      uses: fifsky/html-to-pdf-action@master
      with:
        htmlFile: https://mmoelle1.github.io/OospCpp/_static/lecture5.slides.html?print-pdf
        outputFile: ./docs/source/_static/lecture5.slides.pdf
        pdfOptions: '{"format": "A4", "landscape": true, "printBackground": true, "preferCSSPageSize": true, "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

    - name: Convert upstream lecture 6 to PDF (print view)
      uses: fifsky/html-to-pdf-action@master
      with:
        htmlFile: https://mmoelle1.github.io/OospCpp/_static/lecture6.slides.html?print-pdf
        outputFile: ./docs/source/_static/lecture6.slides.pdf
        pdfOptions: '{"format": "A4", "landscape": true, "printBackground": true, "preferCSSPageSize": true, "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

    - name: Convert upstream lecture 7 to PDF (print view)
      uses: fifsky/html-to-pdf-action@master
      with:
        htmlFile: https://mmoelle1.github.io/OospCpp/_static/lecture7.slides.html?print-pdf
        outputFile: ./docs/source/_static/lecture7.slides.pdf
        pdfOptions: '{"format": "A4", "landscape": true, "printBackground": true, "preferCSSPageSize": true, "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

    - name: Bundle all PDFs into a zip
      run: |
        ls -l docs/source/_static/*.slides.pdf || true
        zip -j docs/source/_static/OospCpp-lectures-pdf.zip docs/source/_static/lecture*.slides.pdf

    # Upload printable PDFs zip as a GitHub Release asset (no Pages needed)
    - name: Upload printable PDFs release asset
      uses: ncipollo/release-action@v1
      with:
        tag: printable-pdfs
        name: Printable PDFs
        allowUpdates: true
        replacesArtifacts: true
        artifacts: docs/source/_static/lecture*.slides.pdf,docs/source/_static/OospCpp-lectures-pdf.zip
        token: ${{ secrets.GITHUB_TOKEN }}

    # Only upstream repo deploys Pages; forks won't publish gh-pages
    - name: build docs (upstream main only)
      if: ${{ github.repository_owner == 'mmoelle1' && github.ref == 'refs/heads/main' }}
      run: |
        sphinx-build -W -b html docs/source docs/build -j auto

    - name: deploy docs (upstream main only)
      uses: peaceiris/actions-gh-pages@v3
      if: ${{ github.repository_owner == 'mmoelle1' && github.ref == 'refs/heads/main' }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        force_orphan: true
