name: docs

on:
  push

jobs:
  build_docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up  python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: install dependencies
      run: |
        pip install -r ./docs/requirements.txt

    - name: create slides 
      run: |
        jupyter nbconvert --to slides --embed-images --template custom_reveal --TemplateExporter.extra_template_basedirs=./docs/ --output-dir docs/source/_static "notebooks/*.ipynb"

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Decktape
      run: |
        npm i -g decktape

    - name: Serve slides locally (HTTP)
      run: |
        python3 -m http.server 9000 --directory docs/source/_static >/dev/null 2>&1 &
        sleep 2

    - name: Convert slides to PDF via Decktape
      env:
        DECKTAPE_TIMEOUT: '60000'
      run: |
        for i in 1 2 3 4 5 6 7; do \
          echo "Converting lecture${i}..."; \
          decktape --timeout=$DECKTAPE_TIMEOUT --load-pause 2000 \
            reveal \
            http://localhost:9000/lecture${i}.slides.html?print-pdf \
            docs/source/_static/lecture${i}.slides.pdf \
            --chrome-arg=--no-sandbox \
            --chrome-arg=--force-color-profile=srgb \
            --chrome-arg=--disable-web-security || exit 1; \
        done

    - name: convert md to rst # md reference is not recognized with md_include
      uses: docker://pandoc/core:latest
      with:
        args: --from=markdown --to=rst --output=docs/source/README.rst README.md

    - name: build docs
      run: |
        sphinx-build -W -b html docs/source docs/build -j auto

    - name: deploy docs only if it is pushed to main
      uses: peaceiris/actions-gh-pages@v3
      # publish every time there's a push to the default branch
      if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        force_orphan: true
